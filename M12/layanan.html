<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel = "preconnect" href = "https://fonts.googleapis.com">
    <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
    <link href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel = "stylesheet">

</head>
<body>
    <header>
        <h1>🎓SILA</h1>
        <p>Sistem Informasi Layanan Akademik</p>
                <nav>
                    <ul class="nav-menu">
                        <li><a href=index.html>Beranda</a><li>
                            <a href="layanan.html"class="active">Ajukan Layanan </a>
                            <a href="riwayat.html">Riwayat</a>
                        </li>
                    </ul>
                </nav>
    </header>
    
    <main>
        <section class="section">
            <div class="container">
                <form actions = "#" method = "post" class = "form-card" onsubmit="return validasiForm()">
                    <fieldset>
                        <legend>Data Pengajuan</legend>
                        <div class = "form-group">
                            <label for = "nama">Nama Lengkap</label>
                            <input type = "text" name = "nama" id = "nama" placeholder = "Masukkan nama lengkap" >
                        </div>

                        <div class = "form-row">
                            <div class = form-group>
                                <label for = "nim">NIM</label>
                                <input type = "text" name = "nim" id = "nim" placeholder = "Contoh : 12345678" >
                            </div>

                            <div class = "form-group">
                                <label for = "prodi">Program Studi</label>
                                <select id="prodi" name="prodi" >
                                    <option value="">Pilih Program Studi</option>
                                    <option value="Teknik Informatika">Teknik Informatika</option>
                                    <option value="Sistem Informasi">Sistem Informasi</option>
                                    <option value="Manajemen">Manajemen</option>
                                    <option value="Akuntansi">Akuntansi</option>
                                </select>
                            </div>
                        </div>

                        <div class = "form-row">
                            <div class = "form-group">
                                <label for = "layanan">Jenis Layanan</label>
                                <select id ="layanan" name = "layanan" >
                                    <option value ="">- Pilih Layanan -</option>
                                    <option value ="SKA">Surat Aktif Kuliah (SKA)</option>
                                    <option value ="CAK">Cuti Akademik (CAK)</option>
                                    <option value ="TNM">Transkrip Nilai (TNM)</option>
                                    <option value ="PDA">Perubahan Data Akademik (PDA)</option>
                                </select>
                            </div>

                            <div class = "form-group">
                                <label for = "tanggal">Tanggal Pengajuan</label>
                                <input type = "date" name = "tanggal" id = "tanggal" >
                            </div>
                        </div>

                        <div class = "form-group">
                            <label for = "keterangan">Keterangan (opsional)</label>
                            <textarea name = "keterangan" id = "keterangan"rows = "3" 
                            placeholder = "Jelaskan alasan pengajuan Anda..." ></textarea>
                        </div>

                        <div class = "form-actions">
                            <button type = "submit" class = "btn btn-primary">Ajukan Sekarang</button>
                            <button type = "reset" class = "btn btn-outline">Reset</button>
                        </div>
                        
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <strong>🎓SILA</strong>
                <p>Platform digital untuk pengajuan layanan akademik mahasiswa</p>
            </div>
            <div class = "footer-nav">
                <h4>Navigasi</h4>
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="./layanan.html">Ajukan Layanan</a></li>
                    <li><a href="riwayat.html">Riwayat</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 SILA - Dibuat untuk tugas Pemrograman Web</p>
            </div>
        </div>
    </footer>
</html>
